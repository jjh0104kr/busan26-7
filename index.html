<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>피란의 기억을 잇다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
  :root {
    --page: #d8d2c3;
    --cream: #f1e7cc;
    --ink: #2a2218;
    --paper: #eadfc0;
    --paper-2: #d6c294;
    --brass: #b8924a;
    --brass-hi: #f0cf7a;
    --line: #231b13;
    --serif: "Noto Serif KR", "Gowun Batang", "Nanum Myeongjo", "Batang", "Apple SD Gothic Neo", serif;
    --book: "Gowun Batang", "Noto Serif KR", "Nanum Myeongjo", "Batang", "Apple SD Gothic Neo", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #0b0f15; }
  }
  :root[data-theme="dark"] { --page: #0b0f15; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--page);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--book);
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; }
  body { touch-action: manipulation; }

  #stage { position: relative; width: 1280px; height: 720px; flex: none; overflow: hidden; background: #000; transform-origin: center center; }
  .screen { position: absolute; inset: 0; visibility: hidden; opacity: 0; }
  .screen.active { visibility: visible; opacity: 1; }
  #fader { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .32s ease; z-index: 50; display: flex; align-items: center; justify-content: center; }
  #fader.on { opacity: 1; pointer-events: auto; }
  #faderLoad { display: none; flex-direction: column; align-items: center; gap: 14px; opacity: 0; transition: opacity .25s ease; }
  #faderLoad.show { display: flex; opacity: 1; }
  #faderLoad .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(232,223,198,0.25); border-top-color: #e8dfc6; animation: faderSpin .8s linear infinite; }
  #faderLoad .load-txt { color: #e8dfc6; font: 600 15px "Noto Sans KR", sans-serif; letter-spacing: .02em; }
  @keyframes faderSpin { to { transform: rotate(360deg); } }
  .bg, .bg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 버튼: 대화창 액자 느낌의 양피지 판 ── */
  .plate {
    --cut: 16px;
    position: relative; border: 0; padding: 0; cursor: pointer; background: var(--line);
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
    transition: transform .15s ease;
  }
  .plate::before, .plate::after { content: ""; position: absolute; }
  .plate::before {
    inset: 3px; background: var(--brass);
    clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 13px, 100% calc(100% - 13px), calc(100% - 13px) 100%, 13px 100%, 0 calc(100% - 13px), 0 13px);
  }
  .plate::after {
    inset: 6px; background: linear-gradient(#f0e5c6, var(--paper-2));
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }
  .plate > * { position: relative; z-index: 1; }
  .plate:hover:not(:disabled), .plate:focus-visible { transform: translateY(-3px); }
  .plate:hover:not(:disabled)::before, .plate:focus-visible::before { background: var(--brass-hi); }
  .plate:focus-visible { outline: none; }
  .plate:disabled { cursor: not-allowed; filter: grayscale(.85) brightness(.66); }

  /* ── 타이틀: 일러스트 위에 버튼 강조 효과만 얹음 ── */
  .title-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .title-art.blur { filter: blur(8px) brightness(.55); transform: scale(1.8); transform-origin: 10% 100%; }
  .tb { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; filter: drop-shadow(0 0 0 rgba(255,205,110,0)); transition: filter .22s ease, transform .18s ease; }
  .school-logo { position: absolute; height: auto; pointer-events: none; filter: drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .tb .fill, .tb .sheen { position: absolute; inset: 0; pointer-events: none; clip-path: polygon(3.8% 0, 96.2% 0, 100% 17.5%, 100% 82.5%, 96.2% 100%, 3.8% 100%, 0 82.5%, 0 17.5%); }
  .tb .fill { background: radial-gradient(ellipse at 50% 50%, rgba(255,228,165,.15), rgba(255,206,120,.05) 72%); opacity: 0; transition: opacity .2s ease; }
  .tb .sheen::before { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 34%; background: linear-gradient(100deg, transparent, rgba(255,242,205,.6), transparent); transform: skewX(-18deg); opacity: 0; }
  .tb .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .2s ease; }
  .tb .ring polygon { fill: none; stroke: #ffe3a3; stroke-width: 2.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .tb:hover, .tb:focus-visible { filter: drop-shadow(0 0 3px rgba(255,225,150,.95)) drop-shadow(0 0 14px rgba(255,190,90,.75)); transform: scale(1.02); outline: none; }
  .tb:hover .fill, .tb:focus-visible .fill, .tb:hover .ring, .tb:focus-visible .ring { opacity: 1; }
  .tb:hover .sheen::before, .tb:focus-visible .sheen::before { animation: sheen .8s ease-out 1 forwards; }
  .tb:active { transform: scale(.99); }
  @keyframes sheen { 0% { left: -40%; opacity: 1; } 100% { left: 110%; opacity: 1; } }
  .tb.sm .fill, .tb.sm .sheen { clip-path: polygon(5.2% 0, 94.8% 0, 100% 17.4%, 100% 82.6%, 94.8% 100%, 5.2% 100%, 0 82.6%, 0 17.4%); }
  #stage.on-credits .mute { top: 52px; }   /* 제작자 그림 오른쪽 위 글씨를 가리지 않게 */
  .toast { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); padding: 12px 28px; background: rgba(20,16,12,.9); color: var(--cream); border: 1px solid var(--brass); border-radius: 4px; font: 400 22px var(--book); letter-spacing: .06em; opacity: 0; transition: opacity .25s ease; pointer-events: none; z-index: 40; }
  .toast.show { opacity: 1; }

  /* ── 챕터 선택 ── */
  .shade-all { position: absolute; inset: 0; background: rgba(6,9,14,.5); }
  .ch-head { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
  .ch-head h2 { margin: 0; font: 700 50px/1.2 var(--serif); letter-spacing: .16em; color: var(--cream); }
  .ch-head i { display: block; width: 96px; height: 3px; background: var(--brass); margin: 22px auto 0; }
  .ch-grid { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 320px); gap: 30px 32px; }
  .card { height: 152px; color: var(--ink); text-align: center; }
  .card .in { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; height: 100%; padding: 0 14px; }
  .card i.eng { font: 600 17px/1 var(--book); font-style: normal; letter-spacing: .16em; color: #8a6a32; text-transform: uppercase; white-space: nowrap; }
  .card b { font: 700 25px/1.2 var(--serif); letter-spacing: .02em; white-space: nowrap; }
  .card small { display: inline-flex; align-items: center; gap: 6px; font: 400 14px/1 var(--book); letter-spacing: .03em; color: #5b4a30; white-space: nowrap; }
  .card small svg { width: 13px; height: 13px; }
  /* ── 챕터 선택 캐러셀 ── */
  .ch-sel { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); padding: 10px 52px 12px; border: 2px solid #e6c46a; border-radius: 10px; background: rgba(30,22,14,.86); color: #f7ecd0; font: 800 38px/1.2 var(--serif); letter-spacing: .3em; text-indent: .3em; white-space: nowrap; box-shadow: 0 6px 16px rgba(30,18,6,.45); }
  .ch-track { position: absolute; left: 0; right: 0; top: 182px; height: 300px; }
  .chposter { position: absolute; left: 50%; top: 0; width: 400px; height: 300px; margin-left: -200px; padding: 0; border: 3px solid #f3e4bd; border-radius: 6px; overflow: hidden; cursor: pointer; background: #222; box-shadow: 0 10px 26px rgba(40,24,8,.55); transition: transform .5s cubic-bezier(.3,.8,.25,1), opacity .4s ease, filter .4s ease; will-change: transform; }
  .chposter img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .chposter .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 46px 18px 14px; text-align: left; background: linear-gradient(to top, rgba(14,9,4,.88), rgba(14,9,4,.55) 55%, rgba(14,9,4,0)); color: #f7ecd0; pointer-events: none; }
  .chposter .cap i { display: block; font: 700 15px/1.2 var(--serif); font-style: normal; letter-spacing: .08em; color: #f0cf7a; margin-bottom: 3px; }
  .chposter .cap b { display: block; font: 800 26px/1.25 var(--serif); letter-spacing: .02em; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .chposter.act { border-color: #e6c46a; }
  .chposter.act:hover { transform: scale(1.025) !important; }
  .ch-title { position: absolute; left: 0; right: 0; top: 487px; text-align: center; font: 800 31px/1.2 var(--serif); color: #4a2a10; letter-spacing: .04em; transition: opacity .2s; }
  .ch-arrow:disabled { opacity: .25; cursor: default; pointer-events: none; }
  .ch-place { position: absolute; left: 0; right: 0; top: 497px; text-align: center; font: 700 19px var(--serif); color: #9a7a4c; letter-spacing: .06em; transition: opacity .2s; }
  .ch-dots { position: absolute; left: 0; right: 0; top: 540px; display: flex; justify-content: center; gap: 12px; }
  .ch-dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(90,62,28,.35); cursor: pointer; transition: all .3s; }
  .ch-dots i.on { background: #8f2f1d; width: 28px; border-radius: 6px; }
  .ch-arrow { position: absolute; left: 30px; top: 300px; width: 56px; height: 76px; border: 2px solid #e6c46a; border-radius: 8px; background: rgba(30,22,14,.82); color: #f3e4bd; font: 700 44px/1 var(--serif); cursor: pointer; padding: 0 0 8px; z-index: 5; transition: background .15s, transform .15s; }
  .ch-arrow:hover { background: rgba(143,47,29,.92); transform: scale(1.07); }
  .ch-bar { position: absolute; left: 44px; bottom: 26px; padding: 12px 26px; border: 2px solid #e6c46a; border-radius: 8px; background: rgba(30,22,14,.86); color: #f7ecd0; font: 700 20px var(--serif); letter-spacing: .08em; cursor: pointer; z-index: 5; transition: background .15s; }
  .ch-bar:hover, .ch-bar:focus-visible { background: rgba(143,47,29,.92); outline: none; }
  .ch-ico { padding: 0; border: none; border-radius: 0; background: none !important; bottom: 44px; transition: transform .15s, filter .15s; filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 8px rgba(0,0,0,.45)); }
  .ch-ico img { display: block; width: 100%; height: auto; pointer-events: none; }
  .ch-ico:hover, .ch-ico:focus-visible { transform: translateY(-4px) scale(1.06); filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 12px rgba(0,0,0,.55)) brightness(1.08); }
  .ch-ico:active { transform: scale(.97); }
  .back { position: absolute; left: 60px; bottom: 48px; background: none; border: 0; cursor: pointer; font: 400 24px var(--book); letter-spacing: .1em; color: var(--cream); padding: 10px 14px; border-radius: 4px; }
  .back:hover, .back:focus-visible { color: var(--brass-hi); outline: none; text-decoration: underline; text-underline-offset: 8px; }

  /* ── 대화 씬 ── */
  #vn { background: #000; cursor: default; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .38s ease; }
  #vn[data-view="room"] .scene, #vn[data-view="roomblack"] .scene, #vn[data-view="roomphoto"] .scene { opacity: 1; }
  .bgphoto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .38s ease; pointer-events: none; }
  #vn[data-view="roomphoto"] .bgphoto { opacity: 1; }
  .bgphoto.blur { filter: blur(7px) brightness(.62); transform: scale(1.06); }
    .scene .vig { position: absolute; inset: 0; z-index: 1; background: linear-gradient(rgba(0,0,0,.26), rgba(0,0,0,.26)), radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 100%); }
  .frozen { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .38s ease; display: block; }
  .frozen.now { transition: none; }
  #vn[data-view="room"] .frozen, #vn[data-view="still"] .frozen { opacity: 1; }   /* roomblack은 맵(frozen)을 띄우지 않고 뒤 배경을 검게 유지 */
  .portrait { position: absolute; z-index: 2; bottom: 215px; height: 470px; transition: filter .28s ease, transform .28s ease; pointer-events: none; }
  .portrait img { height: 100%; display: block; }
  #pBoy { left: 120px; }
  #pGrand { right: 120px; }
  .portrait.dim { filter: brightness(.5) saturate(.72); transform: translateY(12px); }
  .portrait.on { z-index: 3; }

  .dialog { position: absolute; left: 50%; bottom: 18px; width: 1040px; transform: translateX(-50%); opacity: 0; transition: opacity .3s ease; z-index: 5; }
  #vn[data-view="room"] .dialog, #vn[data-view="dark"] .dialog, #vn[data-view="roomblack"] .dialog, #vn[data-view="roomphoto"] .dialog { opacity: 1; }
  .dialog > img { width: 100%; display: block; }
  .dialog .name { position: absolute; left: 9.1%; top: 15%; width: 21%; height: 14.4%; display: flex; align-items: center; justify-content: center; font: 700 26px var(--serif); letter-spacing: .16em; color: #f2e6c8; text-shadow: 0 1px 3px rgba(0,0,0,.7); white-space: nowrap; }
  .dialog .body { position: absolute; left: 8.1%; top: 35.9%; width: 82.8%; height: 56.8%; font: 400 31px/1.56 var(--book); color: #33281c; white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; }
  .dialog .next { position: absolute; left: 93.3%; top: 80.1%; width: 3.65%; opacity: 0; }
  .dialog .next img { width: 100%; display: block; }
  .dialog .next.on { opacity: 1; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  .ch { opacity: 0; }
  .ch.on { opacity: 1; }

  .narr { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .38s ease; z-index: 8; pointer-events: none; }
  #vn[data-view="black"] .narr { opacity: 1; }
  .narr [data-k] { display: none; }
  .narr[data-kind="text"] [data-k="text"], .narr[data-kind="kw"] [data-k="kw"], .narr[data-kind="search"] [data-k="search"] { display: block; }
  .narr-text { max-width: 920px; text-align: center; font: 400 38px/1.75 var(--serif); color: #e8dec6; white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; }
  .narr-next { position: absolute; left: 50%; bottom: 66px; width: 0; height: 0; margin-left: -11px; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 15px solid #c9bb95; opacity: 0; }
  .narr-next.on { opacity: .85; animation: bob 1.1s ease-in-out infinite; }

  .kw { text-align: center; }
  .kw-title { display: flex; align-items: center; justify-content: center; gap: 22px; font: 600 28px/1 var(--serif); letter-spacing: .5em; color: var(--brass-hi); margin-bottom: 54px; min-height: 28px; padding-left: .5em; }
  .kw-title::before, .kw-title::after { content: ""; width: 84px; height: 2px; background: var(--brass); opacity: .8; }
  .kw-list { display: flex; gap: 34px; justify-content: center; }
  .kw-chip { --cut: 12px; position: relative; min-width: 210px; padding: 26px 40px; background: var(--line); opacity: 0; transition: opacity .4s ease; font: 700 44px/1 var(--serif); letter-spacing: .1em; color: var(--ink);
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
  .kw-chip::before { content: ""; position: absolute; inset: 3px; background: linear-gradient(#f0e5c6, var(--paper-2)); border: 2px solid var(--brass);
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); box-sizing: border-box; }
  .kw-chip span { position: relative; }
  .kw-chip.on { opacity: 1; }

  .search-bar { display: flex; align-items: center; gap: 22px; width: 760px; height: 88px; padding: 0 36px; border-radius: 44px; background: #f2ecdd; box-shadow: 0 0 0 3px rgba(184,146,74,.55); }
  .search-bar svg { width: 34px; height: 34px; flex: none; }
  .search-text { font: 400 36px/1 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #26221c; white-space: pre; }
  .caret { width: 2px; height: 40px; background: #26221c; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── 필드 ── */
  .mission { --c: 12px; position: absolute; left: 28px; top: 22px; width: 380px; background: var(--brass); opacity: 0; transition: opacity .3s ease; pointer-events: none; z-index: 5;
    clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
  .mission.on { opacity: 1; }
  .mission .in { margin: 2px; padding: 13px 20px 17px; background: linear-gradient(#231d15, #17130f);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
  .mission .tag { font: 700 15px/1 var(--serif); letter-spacing: .36em; color: var(--brass-hi); margin-bottom: 10px; }
  .mission .txt { display: flex; gap: 11px; font: 400 20px/1.5 var(--book); color: var(--cream); word-break: keep-all; }
  .mission .txt::before { content: ""; flex: none; width: 12px; height: 12px; margin-top: 8px; border: 2px solid var(--brass-hi); }
  #field canvas { display: block; width: 1280px; height: 720px; }
  #field canvas:focus { outline: none; }


  /* ── 모바일 터치 버튼: 화면(무대) 바깥 기준으로 고정, 캐릭터가 서는 바닥선 아래에만 놓음 ── */
  #touch { --sz: 72px; position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(14px, env(safe-area-inset-left)); pointer-events: none; z-index: 60; }
  #touch.on { display: flex; }
  .tc { display: flex; gap: calc(var(--sz) * .18); }
  .tbn { pointer-events: auto; position: relative; width: var(--sz); height: var(--sz); border: 0; padding: 0; border-radius: 50%;
    background: rgba(28,23,17,.74); color: var(--cream); font: 700 calc(var(--sz) * .27)/1 var(--serif); letter-spacing: .04em;
    box-shadow: inset 0 0 0 2px var(--brass), 0 2px 10px rgba(0,0,0,.4); touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
  .tbn.down { background: var(--brass); color: var(--ink); box-shadow: inset 0 0 0 2px var(--brass-hi), 0 0 14px rgba(240,207,122,.65); }
  .arr { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-top: calc(var(--sz) * .2) solid transparent; border-bottom: calc(var(--sz) * .2) solid transparent; }
  .arr.l { border-right: calc(var(--sz) * .28) solid currentColor; transform: translate(-62%, -50%); }
  .arr.r { border-left: calc(var(--sz) * .28) solid currentColor; transform: translate(-38%, -50%); }


  /* 굵은 글씨 / 강조 */
  .dialog .body .b { font-weight: 700; }
  .dialog .body .em { font-weight: 700; color: #8f2f1d; }
  .narr-text .b { font-weight: 700; }
  .narr-text .em { font-weight: 700; color: var(--brass-hi); }

  /* 사진 장면 (손수건·피란·기억): 대화창에 가리지 않도록 위쪽 빈 공간에 액자로 보여줌 */
  .photo-wrap { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; pointer-events: none; z-index: 3; background: #0b0d10; }
  #vn[data-view="photo"] .photo-wrap, #vn[data-view="photobust"] .photo-wrap { opacity: 1; }
  #vn[data-view="photobust"] .scene { opacity: 1; z-index: 4; }
  #vn[data-view="photobust"] .scene .vig { display: none; }
  .photo-bg { position: absolute; left: -40px; top: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(24px) brightness(.42) saturate(.9); }
  .photo-frame { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px; background: #efe6cf; box-shadow: 0 12px 44px rgba(0,0,0,.65); }
  .photo-frame img { display: block; height: 384px; width: auto; }

// segs: [{s:'글자', b:1, em:1}, {p:멈춤ms}]  — 굵은 글씨/강조/잠시 멈춤을 지원
function typeInto(el, segs, tk, ms) {
  return new Promise(resolve => {
    el.textContent = '';
    const units = [], spans = [];
    for (const sg of segs) {
      if (sg.p) { units.push({ p: sg.p }); continue; }
      for (const ch of sg.s) {
        const s = document.createElement('span');
        s.className = 'ch' + (sg.b ? ' b' : '') + (sg.em ? ' em' : '');
        s.textContent = ch; el.appendChild(s); spans.push(s);
        units.push({ ch, s });
      }
    }
    let i = 0, done = false;
    const finish = () => { if (done) return; done = true; spans.forEach(s => s.classList.add('on')); vn.finish = null; resolve(true); };
    vn.finish = finish;
    if (vn.fast) return finish();
    const tick = () => {
      if (done) return;
      if (tk !== vn.token) { done = true; return resolve(false); }
      if (i >= units.length) return finish();
      const u = units[i++];
      if (u.p) { setTimeout(tick, vn.fast ? 0 : u.p); return; }
      u.s.classList.add('on');
      SFX.blip(vn.voice, u.ch);
      let d = ms;
      if (u.ch === ' ' || u.ch === '\n') d = 0;
      else if (u.ch === ',') d += 70;
      else if ('.…?!'.includes(u.ch)) d += 130;
      setTimeout(tick, d);
    };
    tick();
  });
}

function runQuiz(st) {
  return new Promise(resolve => {
    const qs = st.questions;
    let qi = 0, locked = false;
    const NUM = '①②③④';
    const render = () => {
      const q = qs[qi];
      qNum.textContent = 'Q' + (qi + 1); qCount.textContent = `${qi + 1} / ${qs.length}`;
      qText.textContent = q.q; qMsg.textContent = ''; qMsg.className = 'q-msg';
      qOpts.innerHTML = '';
      q.opts.forEach((o, k) => {
        const b = document.createElement('button'); b.className = 'q-opt';
        b.innerHTML = '<span class="n"></span><span class="t"></span>';
        b.firstChild.textContent = NUM[k]; b.lastChild.textContent = o;
        b.addEventListener('click', e => { e.stopPropagation(); pick(k); });
        qOpts.appendChild(b);
      });
    };
    const pick = k => {
      if (locked || k < 0 || k >= qs[qi].opts.length) return;
      locked = true;
      const btn = qOpts.children[k];
      if (k === qs[qi].ans) {
        btn.classList.add('ok'); SFX.correct(); qMsg.textContent = '정답이에요!'; qMsg.className = 'q-msg ok';
        setTimeout(() => { qi++; locked = false; if (qi >= qs.length) { vn.quizPick = null; quizEl.classList.remove('on'); resolve(); } else render(); }, 950);
      } else {
        btn.classList.add('bad'); SFX.wrong(); qMsg.textContent = st.retry; qMsg.className = 'q-msg bad';
        setTimeout(() => { qi = 0; locked = false; render(); }, 1600);   // 틀리면 Q1로 돌아감
      }
    };
    vn.quizPick = pick;
    quizEl.classList.add('on'); render();
  });
}

    if (tk !== vn.token) return;
    await typeInto(bodyEl, st.segs, tk, SAY_MS);
    if (tk !== vn.token) return;
    nextDlg.classList.add('on');
    vn.ready = true;
    return;
  }

  // 화자가 없는 문장: 검은 화면
  const changed = vn.view !== 'black';
  if (changed) { narr.dataset.kind = 'none'; setView('black'); await sleep(460); }
  else await sleep(200);
  if (tk !== vn.token) return;

  if (st.type === 'narr') {
    narr.dataset.kind = 'text';
    await typeInto(narrText, st.segs, tk, NARR_MS);
  } else if (st.type === 'search') {
    narr.dataset.kind = 'search';
    await typeInto(searchText, plain(st.text), tk, 55);
  } else if (st.type === 'keywords') {
    (st.items || []).forEach(w => noteGot.add(w));      // 기억 노트에 기록
    narr.dataset.kind = 'kw';
    kwTitle.textContent = ''; chips.forEach(c => { c.classList.remove('on'); c.firstChild.textContent = ''; });
    if (!await typeInto(kwTitle, plain(st.title), tk, 70)) return;
    await wait(260);
    for (let k = 0; k < st.items.length && k < chips.length; k++) {
      if (tk !== vn.token) return;
      chips[k].classList.add('on'); SFX.chip();
      await wait(220);
      if (!await typeInto(chips[k].firstChild, plain(st.items[k]), tk, 85)) return;
      if (!game.fragments.includes(st.items[k])) game.fragments.push(st.items[k]);
      await wait(220);
    }
  } else if (st.type === 'shiphorn') {
    narr.dataset.kind = 'text';
    const origBlip = SFX.blip; SFX.blip = () => {};
    const audio = new Audio(A.audio.shipHorn);
    audio.play().catch(() => {});
    await typeInto(narrText, st.segs, tk, NARR_MS);
    SFX.blip = origBlip;
    if (tk !== vn.token) return;
    if (!audio.ended) { await new Promise(res => { audio.addEventListener('ended', res, { once: true }); }); }
  } else if (st.type === 'blackout') {
    narr.dataset.kind = 'none';
    await sleep(1500);
    if (tk !== vn.token) return;
    await showPrologueDone();
    chDone.add('prologue'); await showSummaryCard('prologue');
    await go('chapters');
    return;
  }
  if (tk !== vn.token) return;
  narrNext.classList.add('on');
  vn.ready = true;
}

// 클릭/Space: 타이핑 중이면 글자를 한 번에 모두 표시, 다 나타난 뒤에는 다음 대사로
function advance() {
  if (mode !== 'vn' || vn.view === 'quiz' || vn.view === 'keycard') return;
  if (vn.letterWait && vn.ready) { const r = vn.letterWait; vn.letterWait = null; vn.ready = false; SFX.advance(); r(); return; }   // 편지: 다음 줄
  if (vn.ready) {
    SFX.advance();
    vn.ready = false;
    vn.i++;
    if (vn.i < vn.steps.length) runStep();
    return;
  }
  if (performance.now() - vn.t0 < 250) return;   // 넘기자마자 이어 눌러 건너뛰는 실수 방지
  vn.fast = true;
  if (vn.finish) vn.finish();
}
vnEl.addEventListener('click', advance);

const credPins = [...document.querySelectorAll('.cred-pin')];
const credMsg = (() => {

    </div>`;
  document.getElementById('credits').appendChild(wrap);
  let pages = [], idx = 0, open = false;
  const txt = wrap.querySelector('#credText'), nameEl = wrap.querySelector('#credName');
  let tag = '';
  const TAGC = { 1: '#b8431f', 2: '#25784d', 3: '#1c63a3', 4: '#8a3fa6' };
  const escC = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const tagHtml = () => '';
  function fitPage(str, first) { const d = document.createElement('div'); d.innerHTML = (first ? tagHtml() : '') + escC(str); txt.innerHTML = ''; txt.style.fontSize = '26px'; txt.appendChild(d); return d.getBoundingClientRect().height <= txt.getBoundingClientRect().height + 1; }
  function split(list) {           // list: {t, pre?, color?} — 칸에 다 안 들어가면 문장 단위로 쪽을 나눔 (글씨 크기 유지)
    const out = [];

      const sents = it.t.split(/(?<=[.!?])\s+/); let cur = '', first = true;
      const pre = () => first && it.pre ? it.pre + ' ' : '';
      sents.forEach(sn => { const tryS = cur ? cur + ' ' + sn : sn; if (cur && !fitPage(pre() + tryS)) { out.push({ t: cur, pre: first ? it.pre : '', color: it.color }); first = false; cur = sn; } else cur = tryS; });
      if (cur) out.push({ t: cur, pre: first ? it.pre : '', color: it.color });
    });
    return out;
  }
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function render() {
    const pg = pages[idx];
    txt.innerHTML = ''; txt.style.fontSize = '26px'; const d = document.createElement('div');

    txt.appendChild(d);
    const box = txt.getBoundingClientRect().height;
    for (let fs = 26; fs > 14 && d.getBoundingClientRect().height > box + 1; fs--) txt.style.fontSize = (fs - 1) + 'px';
  }

  function next() { if (idx < pages.length - 1) { idx++; render(); } else close(); SFX.tap(); }

function amiGround(xs) {
  const x = xs / AMI_S;
  let y;
  if (x >= 200) y = 437; else if (x <= 28) y = 232;
  else { let k = 0; while (AMI_SLOPE[k + 1][0] < x) k++; const [x0, y0] = AMI_SLOPE[k], [x1, y1] = AMI_SLOPE[k + 1]; y = y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  return AMI_TOP + y * AMI_S;
}

function runPhotoOrder(items) {                     // 사진을 이야기 순서대로 클릭 (드래그 대신 클릭 방식으로 구현)
  return new Promise(resolve => {
    mode = 'photoOrder';
    const shuffled = [...items].sort(() => Math.random() - 0.5);
    let next = 1;
    const wrap = document.createElement('div');
    wrap.id = 'photoOrderWrap';
    wrap.style.cssText = 'position:absolute;inset:0;z-index:46;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(0,0,0,.82);opacity:0;transition:opacity .4s ease;';
    wrap.innerHTML = `
      <div style="color:#f7ecc9;font:700 20px 'Noto Sans KR',sans-serif;text-shadow:0 2px 6px #000;text-align:center;max-width:80%;line-height:1.6;">사진을 살펴보고,<br>지금까지 진행한 <span style="color:#f0cf7a;">챕터의 이야기 순서대로 클릭</span>해서<br>순서를 올바르게 배치하세요.</div>
      <div id="poCards" style="display:flex;gap:24px;"></div>
      <div id="poMsg" style="min-height:24px;color:#ffb3a0;font:700 17px 'Noto Sans KR',sans-serif;text-shadow:0 1px 4px #000;"></div>
      <div id="poCaption" style="display:none;max-width:640px;background:rgba(20,15,10,.9);border:2px solid #f0cf7a;border-radius:14px;padding:22px 28px;color:#f7ecc9;font:600 17px 'Noto Sans KR',sans-serif;line-height:1.7;text-align:center;white-space:pre-line;"></div>
      <button id="poNext" style="display:none;padding:10px 34px;font:700 16px 'Noto Sans KR',sans-serif;color:#241b10;background:#f0cf7a;border:none;border-radius:12px;cursor:pointer;">다음</button>`;
    (document.getElementById('stage') || document.body).appendChild(wrap);
    const cardsEl = wrap.querySelector('#poCards'), msgEl = wrap.querySelector('#poMsg'),
          capEl = wrap.querySelector('#poCaption'), nextBtn = wrap.querySelector('#poNext');
    function finishAll() {
      setTimeout(() => {
        wrap.style.opacity = '0';
        setTimeout(() => {
          wrap.remove();
          mode = 'field'; lastTs = performance.now(); if (!raf) raf = requestAnimationFrame(loop);
          resolve();
        }, 420);
      }, 200);
    }
    function pick(it) {
      if (it.order !== next) { SFX.wrong(); msgEl.textContent = '순서를 다시 생각해보자.'; return; }
      SFX.correct(); msgEl.textContent = '';
      render();
      capEl.style.display = 'block'; capEl.textContent = it.line;
      nextBtn.style.display = 'inline-block';
      nextBtn.onclick = () => {
        capEl.style.display = 'none'; nextBtn.style.display = 'none';
        next++;
        if (next > items.length) finishAll();
      };
    }
    function render() {
      cardsEl.innerHTML = '';
      shuffled.forEach(it => {
        const done = it.order < next;
        const b = document.createElement('button');
        b.style.cssText = 'width:220px;height:150px;border-radius:10px;border:3px solid ' + (done ? '#7a7460' : '#f0cf7a') + ';background:#111 center/contain no-repeat;background-image:url(' + A[it.img] + ');cursor:' + (done ? 'default' : 'pointer') + ';opacity:' + (done ? '0.45' : '1') + ';position:relative;';
        if (done) {
          const badge = document.createElement('div');
          badge.textContent = String(it.order);
          badge.style.cssText = 'position:absolute;top:6px;left:6px;background:#f0cf7a;color:#241b10;font:700 15px sans-serif;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;';
          b.appendChild(badge);
        } else {
          b.addEventListener('click', () => pick(it));
        }
        cardsEl.appendChild(b);
      });
    }
    render();
    requestAnimationFrame(() => { wrap.style.opacity = '1'; });
  });
}

function runBoxMatch(items) {                      // 추억상자 물건 3개를 각각 '누가 누구에게 준 물건'인지 매칭
  return new Promise(resolve => {
    mode = 'boxmatch';   // field 루프를 잠시 멈춤 (villagerTalk과 동일한 방식)
    const remaining = items.map(it => ({ ...it, done: false }));
    let selectedKey = null;
    const wrap = document.createElement('div');
    wrap.id = 'boxMatchWrap';
    wrap.style.cssText = 'position:absolute;inset:0;z-index:46;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:rgba(0,0,0,.78);opacity:0;transition:opacity .4s ease;';
    wrap.innerHTML = `
      <img id="bmBg" style="position:absolute;top:6%;left:50%;transform:translateX(-50%);width:420px;max-width:44%;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));">
      <div style="position:relative;z-index:1;color:#f7ecc9;font:700 22px 'Noto Sans KR',sans-serif;text-shadow:0 2px 6px #000;margin-bottom:18px;text-align:center;">어떤 기억과 관련있는 물건인지 클릭하세요.</div>
      <div id="bmItems" style="position:relative;z-index:1;display:flex;gap:34px;margin-bottom:22px;min-height:120px;"></div>
      <div id="bmMsg" style="position:relative;z-index:1;min-height:26px;color:#ffb3a0;font:700 18px 'Noto Sans KR',sans-serif;text-shadow:0 1px 4px #000;margin-bottom:10px;"></div>
      <div id="bmOpts" style="position:relative;z-index:1;display:flex;gap:18px;margin-bottom:56px;"></div>`;
    (document.getElementById('stage') || document.body).appendChild(wrap);
    wrap.querySelector('#bmBg').src = A.boxOpen;   // 데이터 URI가 매우 길어 innerHTML 템플릿 대신 속성으로 직접 대입 (엑박 방지)
    const itemsEl = wrap.querySelector('#bmItems'), optsEl = wrap.querySelector('#bmOpts'), msgEl = wrap.querySelector('#bmMsg');
    const renderItems = () => {
      itemsEl.innerHTML = '';
      remaining.forEach(it => {
        if (it.done) return;
        const b = document.createElement('button');
        const hot = selectedKey === it.key;
        b.style.cssText = 'width:120px;height:120px;border-radius:14px;border:3px solid ' + (hot ? '#f0cf7a' : 'rgba(255,255,255,.35)') + ';background:rgba(30,25,19,.7) center/70% no-repeat;background-image:url(' + A[it.img] + ');cursor:pointer;box-shadow:' + (hot ? '0 0 18px rgba(240,207,122,.85)' : 'none') + ';';
        b.title = it.label;
        b.addEventListener('click', () => { selectedKey = it.key; SFX.hover(); renderItems(); });
        itemsEl.appendChild(b);
      });
    };
    BOXMATCH_OPTIONS.forEach(cat => {
      const b = document.createElement('button');
      b.textContent = cat;
      b.style.cssText = 'padding:14px 22px;min-width:200px;font:700 17px/1.35 "Noto Sans KR",sans-serif;color:#241b10;background:#e8d9ab;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4);';
      b.addEventListener('click', () => {
        if (!selectedKey) { msgEl.textContent = '먼저 물건을 선택하세요.'; return; }
        const it = remaining.find(x => x.key === selectedKey);
        if (!it || it.done) return;
        if (it.answer === cat) {
          SFX.correct(); it.done = true; selectedKey = null; msgEl.textContent = '';
          renderItems();
          if (remaining.every(x => x.done)) {
            setTimeout(() => {
              wrap.style.opacity = '0';
              setTimeout(() => {
                wrap.remove();
                mode = 'field'; lastTs = performance.now(); if (!raf) raf = requestAnimationFrame(loop);
                resolve();
              }, 420);
            }, 500);
          }
        } else {
          SFX.wrong(); msgEl.textContent = '다시 생각해보자.';
        }
      });
      optsEl.appendChild(b);
    });
    renderItems();
    requestAnimationFrame(() => { wrap.style.opacity = '1'; });
  });
}

      pages[pageI].forEach(u => { buf.push(u.t); if (u.last) { body.appendChild(mkP(buf.join(' '))); buf = []; } });
      if (buf.length) body.appendChild(mkP(buf.join(' ')));
      wrap.querySelector('#exPg').textContent = (pageI + 1) + ' / ' + pages.length;
      wrap.querySelector('#exPrev').style.opacity = pageI === 0 ? '.35' : '1';
      wrap.querySelector('#exNext').style.opacity = pageI === pages.length - 1 ? '.35' : '1';
    };
    const turn = d => { if (!pages) return; const k = Math.max(0, Math.min(pages.length - 1, pageI + d)); if (k !== pageI) { pageI = k; SFX.click(); renderPage(); } };
    if (pages) {
      nav.style.display = 'flex'; renderPage();
      wrap.querySelector('#exPrev').addEventListener('click', () => turn(-1));
      wrap.querySelector('#exNext').addEventListener('click', () => turn(1));
    }
    requestAnimationFrame(() => { wrap.style.opacity = '1'; });
    let done = false;
    function close() {
      if (done) return; done = true;
      window.removeEventListener('keydown', onKey, true);
      SFX.click();
      wrap.style.opacity = '0';
      setTimeout(() => { wrap.remove(); resolve(); }, 250);
    }
    function onKey(e) { if (e.code === 'Escape' || e.code === 'Backspace') { e.preventDefault(); e.stopPropagation(); close(); } else if (pages && (e.code === 'ArrowRight' || e.code === 'ArrowDown' || e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); e.stopPropagation(); turn(1); } else if (pages && (e.code === 'ArrowLeft' || e.code === 'ArrowUp')) { e.preventDefault(); e.stopPropagation(); turn(-1); } }
    window.addEventListener('keydown', onKey, true);
    wrap.querySelector('#exBack').addEventListener('click', close);
  });
}

function runKeycards(st) {                        // 검은 화면에 제목 + 카드 여러 장이 순서대로 나타남

    wrap.style.cssText = 'position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:rgba(0,0,0,.55);';

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:90%;';
    wrap.appendChild(row);
    const hint = document.createElement('div');
    hint.textContent = '클릭하여 계속하기';
    hint.style.cssText = 'color:#cfc3a6;font:500 14px "Noto Sans KR",sans-serif;opacity:0;transition:opacity .5s ease;margin-top:6px;';
    wrap.appendChild(hint);
    (document.getElementById('vn') || document.body).appendChild(wrap);
    requestAnimationFrame(() => { title.style.opacity = '1'; });
    (st.cards || []).forEach((txt, i) => {
      const card = document.createElement('div');
      card.textContent = txt;
      card.style.cssText = 'background:rgba(28,23,17,0.92);border:2px solid #f0cf7a;border-radius:14px;padding:22px 26px;min-width:150px;'
        + 'color:#f7ecc9;font:700 17px "Noto Sans KR",sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5);'
        + 'opacity:0;transform:translateY(18px) scale(.92);transition:opacity .45s ease,transform .45s ease;';
      row.appendChild(card);
      setTimeout(() => { card.style.opacity = '1'; card.style.transform = 'translateY(0) scale(1)'; }, 500 + i * 420);
    });
    const totalDelay = 500 + (st.cards || []).length * 420 + 300;
    setTimeout(() => { hint.style.opacity = '1'; }, totalDelay);
    let canClose = false;
    setTimeout(() => { canClose = true; }, totalDelay);
    const onClick = () => {
      if (!canClose) return;
      wrap.removeEventListener('click', onClick);
      wrap.style.transition = 'opacity .35s ease'; wrap.style.opacity = '0';
      setTimeout(() => { wrap.remove(); resolve(); }, 380);
    };
    wrap.addEventListener('click', onClick);
    SFX.mission();
  });

    let progress = 0, lastAngle = null, lastX = null, lastY = null, done = false, lastSfx = 0;
    const NEEDED = Math.PI * 2 * 4;   // 대략 네 바퀴 정도 돌리면 완성
    const RMIN = 60, RMAX = 150;   // 우유잔 테두리 부근에서만 원형 동작으로 인정(중앙 근처에 가만히 있거나 이미지 밖으로 나가면 무시)

function runCleanMonumentMinigame() {          // 먼지 레이어를 마우스로 문질러 지우는 미니게임(누르지 않고 지나가기만 해도 지워짐)
  return new Promise(resolve => {
    const W = 330, H = Math.round(W * 1000 / 660);
    const wrap = document.createElement('div');
    wrap.id = 'cleanWrap';
    wrap.style.cssText = 'position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-bottom:28px;';
    const hint = document.createElement('div');
    hint.textContent = '준공기념비에 마우스를 좌우로 움직여 닦아보자!';
    hint.style.cssText = 'color:#f7ecc9;font:700 19px "Noto Sans KR",sans-serif;text-shadow:0 2px 6px #000;background:rgba(20,16,10,.6);padding:10px 24px;border-radius:14px;border:1.5px solid rgba(240,207,122,.6);text-align:center;';
    wrap.appendChild(hint);

    const frame = document.createElement('div');
    frame.style.cssText = `position:relative;width:${W}px;height:${H}px;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.55);`;
    const img = document.createElement('img');
    img.src = A.ch2.junggongIll;
    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
    frame.appendChild(img);
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none;';
    frame.appendChild(cv);
    wrap.appendChild(frame);

    const pctEl = document.createElement('div');
    pctEl.style.cssText = 'color:#f0cf7a;font:700 15px "Noto Sans KR",sans-serif;text-shadow:0 1px 3px #000;';
    pctEl.textContent = '0%';
    wrap.appendChild(pctEl);

    const btn = document.createElement('button');
    btn.textContent = '비문 읽기';
    btn.style.cssText = 'padding:12px 40px;font:700 17px "Noto Sans KR",sans-serif;color:#241b10;background:#f0cf7a;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .4s ease;';
    wrap.appendChild(btn);
    document.getElementById('vn').appendChild(wrap);

    const gctx = cv.getContext('2d');
    gctx.fillStyle = 'rgba(96,84,62,0.85)';
    gctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 260; i++) {
      const x = Math.random() * W, y = Math.random() * H, r = 6 + Math.random() * 22;
      gctx.fillStyle = `rgba(${(60 + Math.random() * 50) | 0},${(50 + Math.random() * 40) | 0},${(34 + Math.random() * 30) | 0},${(0.25 + Math.random() * 0.35).toFixed(2)})`;
      gctx.beginPath(); gctx.arc(x, y, r, 0, Math.PI * 2); gctx.fill();
    }

    const GW = 44, GH = Math.round(GW * H / W);
    const mask = new Uint8Array(GW * GH);
    let cleanedCount = 0;
    const total = GW * GH;
    let revealed = false, lastSfx = 0;

    function wipeAt(x, y) {
      const R = 42;
      gctx.save();
      gctx.globalCompositeOperation = 'destination-out';
      const g = gctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, 'rgba(0,0,0,0.95)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      gctx.fillStyle = g;
      gctx.beginPath(); gctx.arc(x, y, R, 0, Math.PI * 2); gctx.fill();
      gctx.restore();
      const gx0 = Math.max(0, Math.floor((x - R) / W * GW)), gx1 = Math.min(GW - 1, Math.ceil((x + R) / W * GW));
      const gy0 = Math.max(0, Math.floor((y - R) / H * GH)), gy1 = Math.min(GH - 1, Math.ceil((y + R) / H * GH));
      const R2 = R * R;
      for (let gy = gy0; gy <= gy1; gy++) {
        for (let gx = gx0; gx <= gx1; gx++) {
          const idx = gy * GW + gx;
          if (mask[idx]) continue;
          const cx = (gx + 0.5) / GW * W, cy = (gy + 0.5) / GH * H;
          const dx = cx - x, dy = cy - y;
          if (dx * dx + dy * dy <= R2) { mask[idx] = 1; cleanedCount++; }
        }
      }
      const pct = Math.min(100, Math.round(cleanedCount / total * 100));
      pctEl.textContent = pct + '%';
      const now = performance.now();
      if (now - lastSfx > 140) { lastSfx = now; SFX.tap(); }
      if (!revealed && pct >= 92) {
        revealed = true;
        btn.style.opacity = '1'; btn.style.pointerEvents = 'auto';
        SFX.mission();
      }
    }
    function toCanvasPt(e) {
      const r = cv.getBoundingClientRect();
      const pt = e.touches ? e.touches[0] : e;
      return { x: (pt.clientX - r.left) * (W / r.width), y: (pt.clientY - r.top) * (H / r.height) };
    }
    cv.addEventListener('pointermove', e => { const pt = toCanvasPt(e); wipeAt(pt.x, pt.y); });
    cv.addEventListener('touchmove', e => { e.preventDefault(); const pt = toCanvasPt(e); wipeAt(pt.x, pt.y); }, { passive: false });

    btn.addEventListener('click', () => {
      SFX.click();
      wrap.style.transition = 'opacity .35s ease'; wrap.style.opacity = '0';
      setTimeout(() => { wrap.remove(); resolve(); }, 380);
    });
  });
}

/* ─────────── 터치 버튼 (모바일) ─────────── */
const touchEl = $('#touch');
let touchOn = matchMedia('(pointer: coarse)').matches;   // 데스크톱에서는 T 키로 미리보기
function updateTouch() {
  const on = touchOn && mode === 'field';
  touchEl.classList.toggle('on', on);

  if (!on) { touchEl.querySelectorAll('.down').forEach(b => b.classList.remove('down')); return; }
  // 캐릭터가 서는 바닥선(GROUND) 아래쪽 공간에 맞춰 버튼 크기 결정 → 캐릭터를 가리지 않음
  const r = stage.getBoundingClientRect(), k = r.height / VH;
  const safeB = parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0;
  const avail = window.innerHeight - safeB - 10 - (r.top + (GROUND + 14) * k);
  touchEl.style.setProperty('--sz', clamp(Math.floor(avail), 46, 76) + 'px');
}
const TDIR = { left: -1, right: 1 };
touchEl.querySelectorAll('.tbn').forEach(b => {
  const k = b.dataset.k;
  const down = e => {
    e.preventDefault();
    if (b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (_) {} }
    b.classList.add('down'); SFX.tap();
    if (TDIR[k] !== undefined) { const i = held.indexOf(TDIR[k]); if (i >= 0) held.splice(i, 1); held.push(TDIR[k]); }
    else if (k === 'jump') jumpReq = performance.now();
    else if (k === 'pick') pickReq = performance.now();
  };
  const up = () => {
    b.classList.remove('down');
    if (TDIR[k] !== undefined) { const i = held.indexOf(TDIR[k]); if (i >= 0) held.splice(i, 1); }
  };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
touchEl.addEventListener('contextmenu', e => e.preventDefault());

/* ─────────── 키 입력 (e.code 사용: 한글 입력 상태에서도 동작) ─────────── */
addEventListener('keydown', e => {
  if (mode === 'credits' && credMsg.isOpen()) { if (e.code === 'Escape') credMsg.close(); else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') { e.preventDefault(); credMsg.next(); } return; }
  if (mode === 'credits' && e.code === 'Escape' && !busy) { busy = true; go('title').then(() => { busy = false; }); return; }
  if (mode === 'vn') {
    if (vn.view === 'quiz') { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4 && vn.quizPick) vn.quizPick(n - 1); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) advance(); }
    return;
  }
  if (mode !== 'field') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  const now = performance.now();
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    const d = e.code === 'ArrowLeft' ? -1 : 1;
    const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); held.push(d);
  } else if (e.code === 'Space') { if (!e.repeat && !(plankGame && plankGame.active)) jumpReq = now; }
  else if (e.code === 'KeyZ') { if (!e.repeat && !(plankGame && plankGame.active)) pickReq = now; }
  else if (e.code === 'KeyT') { if (!e.repeat) { touchOn = !touchOn; updateTouch(); } }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { const d = e.code === 'ArrowLeft' ? -1 : 1; const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); }
});
addEventListener('blur', () => { held.length = 0; });

window.__game = game;
})();
